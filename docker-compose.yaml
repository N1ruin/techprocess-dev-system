version: '3.8'

services:
  pg_techprocess:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=techprocess_db
    volumes:
      - pg_techprocess:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: techprocess-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pg_techprocess:5432/techprocess_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      pg_techprocess:
        condition: service_healthy

volumes:
  pg_techprocess: